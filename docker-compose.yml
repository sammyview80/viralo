version: "3.9"

x-service-defaults: &service-defaults
  networks:
    - viralo-internal
  restart: unless-stopped
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viralo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralo}
      POSTGRES_DB: viralo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U viralo"]

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-viralo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-viralo}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 10800000"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_VIDEO_BASE: ${VITE_VIDEO_BASE:-}
        VITE_AGENT_BASE: ${VITE_AGENT_BASE:-}
        VITE_PLATFORM_BASE: ${VITE_PLATFORM_BASE:-}
        VITE_OAUTH_REDIRECT: ${VITE_OAUTH_REDIRECT:-}
        VITE_YOUTUBE_CLIENT_ID: ${VITE_YOUTUBE_CLIENT_ID:-}
        VITE_FB_APP_ID: ${VITE_FB_APP_ID:-}
        VITE_IG_CLIENT_ID: ${VITE_IG_CLIENT_ID:-}
        VITE_LI_CLIENT_ID: ${VITE_LI_CLIENT_ID:-}
        VITE_TWITTER_KEY: ${VITE_TWITTER_KEY:-}
        VITE_TIKTOK_KEY: ${VITE_TIKTOK_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]

  # ── API Services ──────────────────────────────────────────────────────────

  migrate:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/core/Dockerfile
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/core/Dockerfile
    command: python scripts/seed_dev_user.py
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  core-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/core/Dockerfile
    ports:
      - "8001:8001"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]

  video-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/video/Dockerfile
    ports:
      - "8003:8003"
    # 2g: the /youtube/formats probe runs yt-dlp + a Deno n-challenge solver
    # in-process; Deno's V8 was OOM-killed (SIGKILL -9) under the old 512m cap.
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      YTDLP_COOKIES_FILE: /app/yt-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_PROXY_LIST: ${YTDLP_PROXY_LIST:-}
      # /youtube/formats probes yt-dlp in-process; needs the PO-token server like the workers.
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
    volumes:
      - video-temp:/tmp/viralo-video
      - video-storage:/tmp/viralo-storage
      - ./yt-cookies.txt:/app/yt-cookies.txt:ro
      - yt-cookies-live:/var/lib/yt
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]

  agent-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8004:8004"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]

  workflow-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    ports:
      - "8005:8005"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]

  platform-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    ports:
      - "8006:8006"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]

  # ── Workers ───────────────────────────────────────────────────────────────

  # PO Token provider — yt-dlp web/tv/mweb clients need PO tokens to return formats.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    networks:
      - viralo-internal
    expose:
      - "4416"
    healthcheck:
      # image has only node — no curl/wget
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-video-pipeline:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/video/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.video.pipeline --concurrency=4 --loglevel=info
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      YTDLP_COOKIES_FILE: /app/yt-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_PROXY_LIST: ${YTDLP_PROXY_LIST:-}
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
      MALLOC_ARENA_MAX: "2"
    volumes:
      - video-temp:/tmp/viralo-video
      - video-storage:/tmp/viralo-storage
      - ./yt-cookies.txt:/app/yt-cookies.txt:ro
      - yt-cookies-live:/var/lib/yt
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery-video-ai:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/video/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.video.ai --concurrency=2 --loglevel=info
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      YTDLP_COOKIES_FILE: /app/yt-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_PROXY_LIST: ${YTDLP_PROXY_LIST:-}
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
      MALLOC_ARENA_MAX: "2"
    volumes:
      - video-temp:/tmp/viralo-video
      - video-storage:/tmp/viralo-storage
      - ./yt-cookies.txt:/app/yt-cookies.txt:ro
      - yt-cookies-live:/var/lib/yt
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery-video-upload:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/video/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.video.upload --concurrency=8 --pool=threads --loglevel=info
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      YTDLP_COOKIES_FILE: /app/yt-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_PROXY_LIST: ${YTDLP_PROXY_LIST:-}
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
      MALLOC_ARENA_MAX: "2"
    volumes:
      - video-temp:/tmp/viralo-video
      - video-storage:/tmp/viralo-storage
      - ./yt-cookies.txt:/app/yt-cookies.txt:ro
      - yt-cookies-live:/var/lib/yt
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery-video-generate:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/video/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.video.generate --concurrency=2 --loglevel=info
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      YTDLP_COOKIES_FILE: /app/yt-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_PROXY_LIST: ${YTDLP_PROXY_LIST:-}
      RAPIDAPI_TIKTOK_KEY: ${RAPIDAPI_TIKTOK_KEY:-}
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
      MALLOC_ARENA_MAX: "2"
    volumes:
      - video-temp:/tmp/viralo-video
      - video-storage:/tmp/viralo-storage
      - ./yt-cookies.txt:/app/yt-cookies.txt:ro
      - yt-cookies-live:/var/lib/yt
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery-agent:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.agent.run --concurrency=1 --pool=threads --loglevel=info
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-workflow:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.workflow.execute --concurrency=8 --loglevel=info
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-post:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.post.publish,viralo.analytics.ingest --concurrency=10 --loglevel=info
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-notification:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    command: celery -A workers.celery_app worker -Q viralo.notifications --concurrency=4 --loglevel=info
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/core/Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - celery-beat-data:/var/lib/celery
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Dev Tools ─────────────────────────────────────────────────────────────

  flower:
    <<: *service-defaults
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${RABBITMQ_URL:-amqp://viralo:viralo@rabbitmq:5672//}
    depends_on:
      rabbitmq:
        condition: service_healthy

  pgadmin:
    <<: *service-defaults
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viralo.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}

networks:
  viralo-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  video-temp:
  video-storage:
  celery-beat-data:
  yt-cookies-live:  # writable live YouTube cookie store; refreshed by keep-warm task
