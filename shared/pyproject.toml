[project]
name = "viralo-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "celery[rabbitmq]>=5.4",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "requests>=2.32",
    "aiofiles>=24.1",
    "aio-pika>=9.4",
    "boto3>=1.35",
    "cloudinary>=1.41",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "aiosmtplib>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
