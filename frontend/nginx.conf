server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    location /core-api/ {
        proxy_pass http://core-service:8001/api/v1/;
    }

    location /video-api/ {
        proxy_pass http://video-service:8003/api/v1/;
    }

    location /agent-api/ {
        proxy_pass http://agent-service:8004/api/v1/;
    }

    location /platform-api/ {
        proxy_pass http://platform-service:8006/api/v1/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
