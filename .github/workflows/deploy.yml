name: Deploy to Production

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_APP_DIR }}

            echo "==> Pulling latest code"
            git pull origin dev

            echo "==> Rebuilding and restarting changed services"
            # No --force-recreate: that flag recreates EVERY container on every
            # push regardless of what changed, killing in-flight video renders
            # and social posts mid-task on every deploy. Plain `up -d --build`
            # already recreates only services whose image/config actually changed.
            docker compose up -d --build

            echo "==> Reloading nginx"
            docker compose exec -T nginx nginx -s reload 2>/dev/null || true

            echo "==> Deploy complete"
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -v "^NAMES"
