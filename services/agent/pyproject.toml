[project]
name = "viralo-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "viralo-shared",
    "celery[rabbitmq]>=5.4",
    "redis>=5.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=0.1",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    "psycopg[binary]>=3.1",
    "websockets>=12.0",
    "tavily-python>=0.3",
    "cryptography>=42.0",
    "google-api-python-client>=2.0",
    "yt-dlp>=2024.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
