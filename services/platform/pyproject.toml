[project]
name = "viralo-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "viralo-shared",
    "celery[rabbitmq]>=5.4",
    "redis>=5.2",
    "requests>=2.32",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "cryptography>=42.0",
    "aiosmtplib>=3.0",
    "pywebpush>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_svc"]
