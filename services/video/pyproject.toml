[project]
name = "viralo-video"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.2",
    "aiofiles>=24.1",
    "python-multipart>=0.0.18",
    "yt-dlp>=2024.11",
    "pytubefix>=8.0",
    "openai>=1.55",
    "boto3>=1.35",
    "aio-pika>=9.4",
    "viralo-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video"]
