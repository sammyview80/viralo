upstream core_service {
    server core-service:8001;
}

upstream video_service {
    server video-service:8003;
}

upstream agent_service {
    server agent-service:8004;
}

upstream workflow_service {
    server workflow-service:8005;
}

upstream platform_service {
    server platform-service:8006;
}

upstream frontend_service {
    server frontend:3000;
}

gzip on;
gzip_types text/plain application/json application/javascript text/css;
gzip_min_length 1000;

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# SSE / streaming proxy defaults
map $http_accept $is_sse {
    default         0;
    "~*text/event-stream" 1;
}

server {
    listen 80;
    server_name viraloapp.tech www.viraloapp.tech 161.97.159.159;

    # Redirect www → apex
    if ($host = www.viraloapp.tech) {
        return 301 http://viraloapp.tech$request_uri;
    }

    # ── Video service ──────────────────────────────────────────────────────
    location /api/v1/video/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://video_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2g;
    }

    location /api/v1/videos {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://video_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 2g;
    }

    location /api/v1/clips {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://video_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ── Agent service ──────────────────────────────────────────────────────
    location /api/v1/agent/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://agent_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/v1/sessions {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://agent_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/tags/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://agent_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/trends {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://agent_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket ──────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://agent_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Workflow service ───────────────────────────────────────────────────
    location /api/v1/workflow/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://workflow_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Platform service ───────────────────────────────────────────────────
    location /api/v1/platform/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://platform_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE — notifications stream (no buffering, no timeout)
    location /api/v1/notifications/stream {
        proxy_pass http://platform_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 0;
        chunked_transfer_encoding on;
    }

    # WebSub — no rate limit, hub retries on 5xx
    location /api/v1/websub/ {
        proxy_pass http://platform_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ── Core service (auth, billing, onboarding, etc.) ─────────────────────
    location /api/v1/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://core_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Frontend ───────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
